<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>서울법령정보센터</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%230b4f8a'/%3E%3Ccircle cx='32' cy='32' r='23' fill='white'/%3E%3Ctext x='32' y='42' text-anchor='middle' font-size='27' font-weight='bold' fill='%230b4f8a'%3E法%3C/text%3E%3C/svg%3E">
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;font-family:"Malgun Gothic","Noto Sans KR",Arial,sans-serif;color:#222;background:#fff}
a{text-decoration:none;color:inherit}
.topbar{height:38px;background:#f5f6f8;border-bottom:1px solid #ddd}
.topbar-inner{width:1180px;margin:auto;height:100%;display:flex;justify-content:flex-end;align-items:center;font-size:12px;color:#555}
.topbar a{margin-left:20px}
.header{border-bottom:1px solid #d8d8d8;background:#fff}
.header-inner{width:1180px;margin:auto;height:105px;display:flex;align-items:center}
.brand{display:flex;align-items:center;gap:14px}
.emblem{width:58px;height:58px;border-radius:50%;border:3px solid #0b4f8a;display:flex;align-items:center;justify-content:center;color:#0b4f8a;font-size:29px;font-weight:700}
.brand-title{font-size:25px;font-weight:700;color:#173f68;letter-spacing:-1.5px}
.brand-sub{font-size:10px;color:#777;letter-spacing:1.5px;margin-top:4px}
.nav{background:#0b4f8a;border-bottom:3px solid #08375f}
.nav-inner{width:1180px;margin:auto;display:flex}
.nav button{border:0;background:transparent;color:white;font-size:16px;font-weight:600;padding:18px 30px;cursor:pointer}
.nav button:hover,.nav button.active{background:#08375f}
.main{width:1180px;margin:0 auto;min-height:570px}
.search-area{margin-top:32px;padding:28px 35px;background:#f5f7f9;border:1px solid #dce1e6}
.search-title{text-align:center;font-size:22px;font-weight:700;color:#173f68;margin-bottom:20px}
.search-box{display:flex;max-width:850px;margin:auto;height:48px}
.search-box select{width:140px;border:1px solid #bbb;border-right:0;padding:0 12px;background:white;font-size:14px}
.search-box input{flex:1;border:1px solid #bbb;padding:0 15px;font-size:15px;outline:none}
.search-box button{width:100px;border:0;background:#173f68;color:white;font-size:15px;font-weight:700;cursor:pointer}
.content{margin-top:35px;border-top:2px solid #173f68}
.content-head{height:60px;border-bottom:1px solid #ddd;display:flex;align-items:center;justify-content:space-between}
.content-head h2{margin:0;font-size:21px;color:#173f68}
.content-body{min-height:300px;display:flex;align-items:center;justify-content:center;color:#999;font-size:14px}
.font-controls{font-size:12px;color:#777}
.font-controls button{margin-left:5px;border:1px solid #ccc;background:#fff;padding:4px 8px;cursor:pointer}
.footer{background:#f2f3f5;border-top:1px solid #d7d7d7;margin-top:50px}
.footer-inner{width:1180px;margin:auto;padding:28px 0;color:#777;font-size:12px;line-height:1.8}
.footer-title{font-weight:700;color:#555;font-size:13px}
.toast{position:fixed;left:50%;bottom:35px;transform:translateX(-50%);background:#333;color:#fff;padding:12px 20px;border-radius:4px;font-size:13px;display:none;z-index:10}
@media(max-width:1200px){
.topbar-inner,.header-inner,.nav-inner,.main,.footer-inner{width:94%}
}
@media(max-width:700px){
.header-inner{height:90px}.brand-title{font-size:19px}.emblem{width:48px;height:48px;font-size:24px}
.nav button{padding:14px 12px;font-size:13px}
.search-box select{width:100px}.search-box button{width:75px}
}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <a href="#">로그인</a>
    <a href="#">회원가입</a>
    <a href="#">이용안내</a>
    <a href="#">English</a>
  </div>
</div>

<header class="header">
  <div class="header-inner">
    <a href="/law/kr/" class="brand" id="home">
      <div class="emblem">法</div>
      <div>
        <div class="brand-title">서울법령정보센터</div>
        <div class="brand-sub">SEOUL LAW INFORMATION CENTER</div>
      </div>
    </a>
  </div>
</header>

<nav class="nav">
  <div class="nav-inner">
    <button class="active" data-page="현행법령">현행법령</button>
    <button data-page="연혁법령">연혁법령</button>
    <button data-page="판례 · 해석">판례 · 해석</button>
    <button data-page="폐지법령">폐지법령</button>
    <button data-page="행정규칙">행정규칙</button>
  </div>
</nav>

<main class="main">
  <section class="search-area">
    <div class="search-title">법령정보 검색</div>
    <div class="search-box">
      <select id="searchType">
        <option>법령명</option>
        <option>본문</option>
        <option>조문</option>
      </select>
      <input id="searchInput" type="text" placeholder="검색어를 입력하세요">
      <button id="searchBtn">검색</button>
    </div>
  </section>

  <section class="content">
    <div class="content-head">
      <h2 id="pageTitle">현행법령</h2>
      <div class="font-controls">
        글자크기
        <button id="fontDown">가-</button>
        <button id="fontUp">가+</button>
      </div>
    </div>
    <div class="content-body" id="contentBody">
      해당 메뉴의 법령정보가 표시되는 영역입니다.
    </div>
  </section>
</main>

<footer class="footer">
  <div class="footer-inner">
    <div class="footer-title">서울법령정보센터</div>
    서울종로경찰서 법령정보 제공을 위한 비공식·가상 웹사이트입니다.<br>
    본 사이트의 법령 및 판례 정보는 실제 국가법령정보센터의 공식 정보가 아닙니다.
  </div>
</footer>

<div class="toast" id="toast"></div>

<script>
const buttons = document.querySelectorAll(".nav button");
const pageTitle = document.getElementById("pageTitle");
const contentBody = document.getElementById("contentBody");
const toast = document.getElementById("toast");

buttons.forEach(button => {
  button.addEventListener("click", () => {
    buttons.forEach(b => b.classList.remove("active"));
    button.classList.add("active");
    const page = button.dataset.page;
    pageTitle.textContent = page;
    contentBody.textContent = page + " 정보가 표시되는 영역입니다.";
  });
});

document.getElementById("searchBtn").addEventListener("click", () => {
  const value = document.getElementById("searchInput").value.trim();
  if (!value) {
    showToast("검색어를 입력하세요.");
    return;
  }
  showToast("현재 검색 기능은 준비 중입니다.");
});

document.getElementById("searchInput").addEventListener("keydown", e => {
  if (e.key === "Enter") document.getElementById("searchBtn").click();
});

let fontSize = 16;
document.getElementById("fontUp").addEventListener("click", () => {
  fontSize = Math.min(fontSize + 1, 22);
  contentBody.style.fontSize = fontSize + "px";
});
document.getElementById("fontDown").addEventListener("click", () => {
  fontSize = Math.max(fontSize - 1, 12);
  contentBody.style.fontSize = fontSize + "px";
});

document.getElementById("home").addEventListener("click", e => {
  e.preventDefault();
  window.location.href = "/law/kr/";
});

function showToast(message) {
  toast.textContent = message;
  toast.style.display = "block";
  clearTimeout(window.toastTimer);
  window.toastTimer = setTimeout(() => toast.style.display = "none", 1800);
}
</script>
</body>
</html>
